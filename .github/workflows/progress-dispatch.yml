name: Bắn cập nhật tiến độ

# Repo .github (profile org) không nhận được event của repo này, nên khi có PR/issue thay đổi
# thì bắn repository_dispatch sang đó để workflow "Cập nhật tiến độ README" chạy ngay.
on:
  pull_request:
    types: [opened, reopened, closed]
  issues:
    types: [opened, reopened, closed, assigned, unassigned]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Thiếu secret (vd chạy từ fork) thì bỏ qua, không làm đỏ PR.
      - name: Bắn dispatch sang PTUDW-2026-Nhom2/.github
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.OW_GH_TOKEN }}
        run: gh api repos/PTUDW-2026-Nhom2/.github/dispatches -f event_type=progress
